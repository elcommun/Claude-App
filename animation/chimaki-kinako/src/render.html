<style>
@font-face{font-family:"Zen Maru Gothic";font-weight:500;src:url(fonts/zmg-500.ttf)}
@font-face{font-family:"Zen Maru Gothic";font-weight:700;src:url(fonts/zmg-700.ttf)}

<script>window.imgReady=new Promise(r=>{const i=new Image();i.onload=()=>{window.DOG_PHOTO=i;r(true)};i.src='file:///home/user/Claude-App/animation/chimaki-kinako/photo.jpg';});</script><canvas id="cv" width="1920" height="1080"></canvas>

<script>
const cv=document.getElementById('cv'), ctx=cv.getContext('2d');
window.ready=(async()=>{await document.fonts.load('700 34px "Zen Maru Gothic"');await document.fonts.load('500 20px "Zen Maru Gothic"');await document.fonts.load('600 30px "Klee One"');await window.imgReady;return true;})();
